[build]
  command = "npm run build"
  publish = ".next"

# Secrets gehören NICHT hierhin — bitte im Netlify-Dashboard eintragen:
# Site settings → Environment variables
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#   OPENAI_API_KEY
#
# Der NEXT_PUBLIC_SUPABASE_ANON_KEY ist zwar öffentlich (Row-Level-Security schützt
# die Daten), aber Konsistenz: alle Env-Vars über das Dashboard, nichts ins Repo.
